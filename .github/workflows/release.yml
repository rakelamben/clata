name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'v1.0.0'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Run Typecheck
        run: npm run typecheck

  build-android:
    name: Build Android Release APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prebuild Native Android Project
        run: npx expo prebuild --platform android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Asset
        id: prepare_asset
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          if [ -z "$RELEASE_TAG" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ github.event.inputs.tag_name || 'v1.0.0' }}"
          fi
          
          OUTPUT_APK="android/app/build/outputs/apk/release/app-release.apk"
          FINAL_NAME="clata-${RELEASE_TAG}.apk"
          
          if [ -f "$OUTPUT_APK" ]; then
            cp "$OUTPUT_APK" "$FINAL_NAME"
            echo "apk_path=$FINAL_NAME" >> $GITHUB_OUTPUT
            echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
            echo "APK ready: $FINAL_NAME"
          else
            echo "Error: Output APK not found at $OUTPUT_APK"
            exit 1
          fi

      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_asset.outputs.release_tag }}
          name: Clata ${{ steps.prepare_asset.outputs.release_tag }}
          files: ${{ steps.prepare_asset.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
